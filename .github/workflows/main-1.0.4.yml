name: Build MY MERL 1.0.4 verified

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: MY-MERL
    steps:
      - uses: actions/checkout@v4

      - name: Verifiche logiche e strutturali
        run: python3 tests/verify_beta.py

      - name: Compilazione Debug simulatore
        run: |
          xcodebuild -project MYMERL.xcodeproj -scheme MYMERL -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-debug-simulator CODE_SIGNING_ALLOWED=NO clean build

      - name: Compilazione Release simulatore
        run: |
          xcodebuild -project MYMERL.xcodeproj -scheme MYMERL -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-release-simulator CODE_SIGNING_ALLOWED=NO clean build

      - name: Compilazione Release iPhone
        run: |
          xcodebuild -project MYMERL.xcodeproj -scheme MYMERL -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build

      - name: Crea IPA
        run: |
          mkdir Payload
          cp -R build-device/Build/Products/Release-iphoneos/MYMERL.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload MY-MERL-1.0.4-build140.ipa

      - name: Pubblica IPA verificato
        uses: actions/upload-artifact@v4
        with:
          name: MY-MERL-1.0.4-build140
          path: MY-MERL/MY-MERL-1.0.4-build140.ipa
          retention-days: 14
